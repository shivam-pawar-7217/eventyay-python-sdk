name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e ".[dev]"
    
    - name: Lint with flake8
      run: |
        # Stop the build on syntax errors or undefined names
        flake8 eventyay/ tests/ --count --exclude=.venv,venv --select=E9,F63,F7,F82 --show-source --statistics
        # Warnings (non-blocking)
        flake8 eventyay/ tests/ --count --exclude=.venv,venv --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test with pytest
      run: |
        pytest tests/ -v --tb=short --cov=eventyay --cov-report=term-missing
    
    - name: Import smoke test
      run: |
        python -c "from eventyay import EventyayClient, AsyncEventyayClient; print('Import OK')"
